[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-harness"
version = "0.1.0"
description = "Agent harness as a learnable artifact: self-optimizing orchestration via execution-trace analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-aiplatform>=1.60",
    "google-cloud-bigquery>=3.25",
    "kubernetes>=29.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
